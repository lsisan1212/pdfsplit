<!DOCTYPE html>
<html lang=zh-TW data-theme=light>
<head>
<meta charset=UTF-8>
<meta name=viewport content="width=device-width,initial-scale=1">
<title>PDF Split</title>
<style>
:root{--bg:#f5f6f8;--fg:#1f2937;--cd:#fff;--bd:#e3e6ea;--in:#fff;--bl:#2563eb;--hn:#64748b;--gb:#eef1f5;--gf:#1f2937;--rb:#fff;--ab:#eff6ff;--ds:#f1f5f9;--df:#94a3b8;--sh:rgba(0,0,0,.08)}
[data-theme=dark]{color-scheme:dark;--bg:#0f172a;--fg:#e2e8f0;--cd:#1e293b;--bd:#334155;--in:#0f172a;--bl:#3b82f6;--hn:#94a3b8;--gb:#334155;--gf:#e2e8f0;--rb:#1e293b;--ab:#1e3a5f;--ds:#334155;--df:#64748b;--sh:rgba(0,0,0,.4)}
*{box-sizing:border-box}
body{font:13px/1.4 system-ui,"Microsoft JhengHei",sans-serif;margin:0;padding:0 14px 14px;background:var(--bg);color:var(--fg)}
#bar{position:sticky;top:0;z-index:100;display:flex;align-items:center;gap:6px;padding:8px 14px;margin:0 -14px 8px;background:var(--cd);border-bottom:1px solid var(--bd);flex-wrap:wrap;box-shadow:0 1px 3px var(--sh)}
#bar h1{font-size:14px;margin:0;white-space:nowrap}
.sp{flex:1}
button,label.fb{padding:6px 11px;border:0;border-radius:6px;background:var(--bl);color:#fff;cursor:pointer;font:inherit;font-size:13px;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
button:disabled{background:var(--df);cursor:not-allowed}
button.g,label.fb.g{background:var(--gb);color:var(--gf)}
label.fb input{display:none}
select{padding:5px 7px;border:1px solid var(--bd);border-radius:6px;background:var(--in);color:var(--fg);font:inherit;font-size:13px}
.tabs{display:flex;gap:2px;background:var(--gb);padding:2px;border-radius:7px}
.tab{background:0;color:var(--gf);padding:5px 12px;font-size:13px;border-radius:5px}
.tab.on{background:var(--cd);box-shadow:0 1px 2px var(--sh)}
#st{font-size:12px;color:var(--hn);margin-bottom:8px;min-height:16px}
.pnl{display:none}.pnl.on{display:block}
.cd{background:var(--cd);border-radius:9px;padding:12px;margin-bottom:10px;box-shadow:0 1px 3px var(--sh)}
input[type=text],input[type=date]{padding:5px 8px;border:1px solid var(--bd);border-radius:6px;font:inherit;font-size:13px;background:var(--in);color:var(--fg)}
#main{display:grid;grid-template-columns:minmax(0,600px) minmax(0,1fr);gap:10px;align-items:start}
#pages{display:flex;flex-direction:column;gap:5px;min-width:0}
.row{display:flex;align-items:center;gap:7px;background:var(--rb);border:1px solid var(--bd);border-radius:8px;padding:5px 9px;flex-wrap:wrap;transition:border-color .15s,background .15s}

.row.att{border-left:4px solid var(--bl)}
.row.att .tm,.row.att .start,.row.att .end{background:var(--ds);color:var(--df)}

let lang='zh-TW';
const t=(k,v)=>{const s=I18N[lang][k];if(typeof s!=='string')return k;return s.replace(/\{(\w+)\}/g,(_,n)=>v?.[n]??'');};

function applyLang(){
  document.documentElement.lang=lang;
  $$('[data-i]').forEach(el=>el.textContent=t(el.dataset.i));
  $('#helpBody').innerHTML=t('help');
  $$('#pages .row').forEach(r=>r._i18n&&r._i18n());
  const pv=$('#pv');
  if(!pv.querySelector('img'))pv.innerHTML=`<div class=ph>${t('pvHint')}</div>`;
}

function setTheme(th){
  document.documentElement.dataset.theme=th;
  $('#themeBtn').textContent=th==='dark'?'☀️':'🌙';
  localStorage.setItem('theme',th);
}
$('#themeBtn').onclick=()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');
$('#lang').onchange=e=>{lang=e.target.value;localStorage.setItem('lang',lang);applyLang();};

$$('.tab').forEach(b=>b.onclick=()=>{
  $$('.tab').forEach(x=>x.classList.remove('on'));
  $$('.pnl').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');$('#'+b.dataset.tab).classList.add('on');
});

let srcBytes=null;
const today=()=>{const d=new Date(),p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;};
const fmtD=d=>String(d||'').replace(/-/g,'');
const setStatus=s=>$('#st').textContent=s;

function fname(tm,s,e){
  const dig=String(tm).replace(/\D/g,'');
  if(!dig)return null;
  const sF=fmtD(s);if(!sF)return null;
  const eF=fmtD(e||s),tmP=dig.padStart(6,'0');
  return eF&&eF!==sF?`${tmP}_${sF}_${eF}.pdf`:`${tmP}_${sF}.pdf`;
}
function dl(blob,name){
  const u=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=u;a.download=name;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(u),4000);
}

/* ---------- TIFF -> PDF pages (via UTIF.js) ---------- */
async function addTiffPages(out,buf,fileName){
  if(!window.UTIF) throw new Error(t('noUTIF'));
  const ifds=UTIF.decode(buf);
  if(!ifds||!ifds.length) throw new Error(t('tiffErr')+'no IFD');

  // 只保留有寬高的 IFD，並排除縮圖
  let cands=ifds.filter(im=>im.t256&&im.t257&&im.t256[0]&&im.t257[0]);
  if(!cands.length) throw new Error(t('tiffErr')+'no image IFD');

  // 排除 NewSubfileType bit0 = 1（reduced-resolution / 縮圖）
  const noThumb=cands.filter(im=>!(im.t254&&(im.t254[0]&1)===1));
  if(noThumb.length) cands=noThumb;

  // 面積門檻：小於最大面積 25% 者視為縮圖
  const maxArea=Math.max(...cands.map(im=>im.t256[0]*im.t257[0]));
  const pages=cands.filter(im=>im.t256[0]*im.t257[0]>=maxArea*0.25);

  let added=0;
  for(const im of pages){
    try{
      UTIF.decodeImage(buf,im,ifds);
      const rgba=UTIF.toRGBA8(im);
      const w=im.width,h=im.height;
      if(!w||!h) continue;
      const cnv=document.createElement('canvas');
      cnv.width=w;cnv.height=h;
      const ctx=cnv.getContext('2d');
      ctx.putImageData(new ImageData(
        new Uint8ClampedArray(rgba.buffer,rgba.byteOffset,rgba.length),w,h),0,0);
      const pb=await new Promise(r=>cnv.toBlob(r,'image/png'));
      const img=await out.embedPng(new Uint8Array(await pb.arrayBuffer()));
      const s=Math.min(1,595/img.width,842/img.height);
      const pw=img.width*s,ph=img.height*s;
      out.addPage([pw,ph]).drawImage(img,{x:0,y:0,width:pw,height:ph});
      added++;
    }catch(err){ console.warn('TIFF page skipped:',err); }
  }
  if(!added) throw new Error(t('tiffErr')+fileName);
  return added;
}

$('#fileInput').addEventListener('change',async e=>{
  const files=[...e.target.files];if(!files.length)return;
  setStatus(t('reading'));
  try{
    const out=await PDFDocument.create();
    for(const f of files){
      const buf=await f.arrayBuffer();
      if(f.type==='application/pdf'||/\.pdf$/i.test(f.name)){
        const src=await PDFDocument.load(buf,{ignoreEncryption:true});
        (await out.copyPages(src,src.getPageIndices())).forEach(p=>out.addPage(p));
      }
      else if(/\.(tif|tiff)$/i.test(f.name)||f.type==='image/tiff'){
        await addTiffPages(out,buf,f.name);
      }
      else if(f.type.startsWith('image/')){
        let img;
        if(f.type==='image/jpeg')img=await out.embedJpg(new Uint8Array(buf));
        else if(f.type==='image/png')img=await out.embedPng(new Uint8Array(buf));
        else{
          const bmp=await createImageBitmap(new Blob([buf],{type:f.type}));
          const c=document.createElement('canvas');c.width=bmp.width;c.height=bmp.height;
          c.getContext('2d').drawImage(bmp,0,0);
          const pb=await new Promise(r=>c.toBlob(r,'image/png'));
          img=await out.embedPng(new Uint8Array(await pb.arrayBuffer()));
        }
        const s=Math.min(1,595/img.width,842/img.height);
        const w=img.width*s,h=img.height*s;
        out.addPage([w,h]).drawImage(img,{x:0,y:0,width:w,height:h});
      }
      else if(/\.(dng|cr2|nef|arw|raf|rw2)$/i.test(f.name)){
        // RAW 檔也走 UTIF
        await addTiffPages(out,buf,f.name);
      }
    }
    srcBytes=await out.save();
    await buildRows();
    setStatus(t('loaded',{n:out.getPageCount()}));
    e.target.value='';   // 允許再次選同一批檔案
  }catch(err){console.error(err);setStatus(t('readErr')+err.message);}
});

async function buildRows(){
  const box=$('#pages');box.innerHTML='';
  const pdf=await pdfjsLib.getDocument({data:srcBytes.slice()}).promise;
  const d0=today();
  const pv=$('#pv');
  pv.innerHTML=`<div class=ph>${t('pvHint')}</div>`;
  let curIdx=-1;

  for(let i=1;i<=pdf.numPages;i++){
    const pg=await pdf.getPage(i);
    const vS=pg.getViewport({scale:.25});
    const cS=document.createElement('canvas');
    cS.width=Math.ceil(vS.width);cS.height=Math.ceil(vS.height);
    await pg.render({canvasContext:cS.getContext('2d'),viewport:vS}).promise;

    const vL=pg.getViewport({scale:1.5});
    const cL=document.createElement('canvas');
    cL.width=Math.ceil(vL.width);cL.height=Math.ceil(vL.height);
    await pg.render({canvasContext:cL.getContext('2d'),viewport:vL}).promise;

    const row=document.createElement('div');
    row.className='row';
    row.innerHTML=`<span class=pno>${i}</span>
      <input type=checkbox class=pick>
      <img class=thumb src="${cS.toDataURL('image/jpeg',.6)}">
      <input class=tm type=text inputmode=numeric>
      <input class=start type=date value="${d0}">
      <input class=end type=date value="${d0}">
      ${i>1?'<button class="abtn g" type=button></button>':''}`;
    box.appendChild(row);
    row._big=cL.toDataURL('image/jpeg',.85);

    row._i18n=()=>{
      row.querySelector('.tm').placeholder=t('tmPh');
      row.querySelector('.start').title=t('startT');
      row.querySelector('.end').title=t('endT');
      row.querySelector('.pick').title=t('pick');
      const ab=row.querySelector('.abtn');
      if(ab)ab.textContent=row.classList.contains('att')?t('detach'):t('attach');
    };
    row._i18n();

    row.addEventListener('mouseenter',()=>{
      if(curIdx===i)return;
      curIdx=i;
      pv.innerHTML=`<img src="${row._big}">`;
      $$('#pages .row').forEach(r=>r.classList.remove('sel'));
      row.classList.add('sel');
    });

    const se=row.querySelector('.start'),ee=row.querySelector('.end');
    let touched=false;
    ee.addEventListener('input',()=>touched=true);
    se.addEventListener('change',()=>{if(!touched||!ee.value)ee.value=se.value;});
    ee.addEventListener('change',()=>{if(ee.value&&ee.value<se.value){alert(t('endBeforeStart'));ee.value=se.value;}});

    const ab=row.querySelector('.abtn');
    if(ab)ab.onclick=e=>{e.stopPropagation();toggleAtt(row);};
  }
  $('#genBtn').disabled=false;$('#mergeBtn').disabled=false;
}

function toggleAtt(row){
  const rows=$$('#pages .row'),idx=rows.indexOf(row);
  if(!row.classList.contains('att')){
    if(idx===0){alert(t('cannotAttach'));return;}
    row.classList.add('att');
    row.querySelectorAll('.tm,.start,.end').forEach(el=>el.disabled=true);
  }else{
    row.classList.remove('att');
    row.querySelectorAll('.tm,.start,.end').forEach(el=>el.disabled=false);
  }
  row._i18n();
}

$('#genBtn').onclick=async()=>{
  const rows=$$('#pages .row'),groups=[];
  rows.forEach((r,i)=>{
    if(r.classList.contains('att')&&groups.length)groups[groups.length-1].ix.push(i);
    else groups.push({lead:r,ix:[i]});
  });
  const valid=[],skip=[];
  for(const g of groups){
    const tm=g.lead.querySelector('.tm').value.trim();
    const s=g.lead.querySelector('.start').value;
    const e=g.lead.querySelector('.end').value||s;
    const n=fname(tm,s,e);
    if(!n){skip.push(g);continue;}
    valid.push({ix:g.ix,n});
  }
  if(!valid.length){alert(t('noTM'));return;}
  if(skip.length&&!confirm(t('skipConfirm',{n:skip.length})))return;

  $('#genBtn').disabled=true;setStatus(t('generating'));
  try{
    const sd=await PDFDocument.load(srcBytes);
    const zip=new JSZip(),used=new Map();
    let cnt=0;
    for(const g of valid){
      const doc=await PDFDocument.create();
      (await doc.copyPages(sd,g.ix)).forEach(p=>doc.addPage(p));
      const bytes=await doc.save();
      const base=g.n.replace(/\.pdf$/i,'');
      const c=(used.get(base)||0)+1;used.set(base,c);
      zip.file(c>1?`${base}(${c}).pdf`:`${base}.pdf`,bytes);
      cnt++;
    }
    dl(await zip.generateAsync({type:'blob'}),`split_${today()}.zip`);
    setStatus(t('done',{n:cnt}));
  }catch(err){console.error(err);setStatus(t('genErr')+err.message);}
  finally{$('#genBtn').disabled=false;}
};

$('#mergeBtn').onclick=async()=>{
  const picked=$$('#pages .row').map((r,i)=>r.querySelector('.pick').checked?i:-1).filter(i=>i>=0);
  if(!picked.length){alert(t('noPick'));return;}
  const sd=await PDFDocument.load(srcBytes);
  const doc=await PDFDocument.create();
  (await doc.copyPages(sd,picked)).forEach(p=>doc.addPage(p));
  dl(new Blob([await doc.save()],{type:'application/pdf'}),`merged_${picked.length}p.pdf`);
  setStatus(t('mergeOk'));
};

setTheme(localStorage.getItem('theme')||'light');
const sl=localStorage.getItem('lang');if(sl){lang=sl;$('#lang').value=lang;}
applyLang();

// 啟動檢查：UTIF 若載入失敗，提示但不中斷 PDF 功能
window.addEventListener('load',()=>{
  if(!window.UTIF) console.warn(t('noUTIF'));
});
</script>
